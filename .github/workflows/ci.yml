name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, lint, testes e referência
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Família Andrade contra os resultados de referência
        run: npm run reference
